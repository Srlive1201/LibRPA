  - heading: Driver Compatibility Aliases
    markdown: |
      The driver still accepts a few older input keys for backward compatibility, and may remove them in the future.

      | Alias Name | Preferred Name | Notes |
      |------------|----------------|-------|
      | `debug` | [`output_level`](#output-level) | `debug = true` maps to `output_level = debug` |
      | `use_soc` | [`use_spinor_wfc`](#use-spinor-wfc) | Old spelling for selecting spinor-format driver input |
      | `tfgrid_type` | [`tfgrids_type`](#tfgrids-type) | Old spelling |
      | `gf_R_threshold` | [`gf_threshold`](#gf-threshold) | Old spelling |
      | `output_gw_sigc_ks_if` | [`output_gw_sigc_ks_kf`](#output-gw-sigc-ks-kf) | Old spelling |
      | `output_gw_sigc_mat` | [`output_gw_sigc_ks_mat_kf`](#output-gw-sigc-ks-mat-kf) | Old spelling |
      | `option_output_Wc_Rf_mat` | [`output_wc_rf`](#output-wc-rf), [`ifreq_output_wc_start`](#ifreq-output-wc-start), [`ifreq_output_wc_end`](#ifreq-output-wc-end) | `0` disables output, `1` maps to `[0,1)`, `2` maps to `[0,all)` |

      `g0w0_band` is accepted as a deprecated alias of `g0w0`.

      For details on all API parameters, see section below or visit the API documentation of struct {librpa}`LibrpaOptions`.
